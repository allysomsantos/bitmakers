    <line x1="92" y1="106" x2="92" y2="112"/><line x1="108" y1="106" x2="108" y2="112"/><line x1="124" y1="106" x2="124" y2="112"/><line x1="140" y1="106" x2="140" y2="112"/><line x1="156" y1="106" x2="156" y2="112"/><line x1="172" y1="106" x2="172" y2="112"/>
  </g>
  <rect x="82" y="78" width="100" height="28" rx="2" fill="#263238"/>
  <text x="132" y="97" font-size="10" font-weight="700" fill="#eceff1" text-anchor="middle">ULN2003</text>
  <!-- pinos IN -->
  <rect x="45.5" y="136" width="9" height="18" fill="#ffd54f" stroke="#b28704"/>
  <rect x="75.5" y="136" width="9" height="18" fill="#ffd54f" stroke="#b28704"/>
  <rect x="105.5" y="136" width="9" height="18" fill="#ffd54f" stroke="#b28704"/>
  <rect x="135.5" y="136" width="9" height="18" fill="#ffd54f" stroke="#b28704"/>
  <rect x="215.5" y="136" width="9" height="18" fill="#ffd54f" stroke="#b28704"/>
  <rect x="245.5" y="136" width="9" height="18" fill="#ffd54f" stroke="#b28704"/>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <text x="50" y="167" fill="#0d47a1">IN1</text><text x="80" y="167" fill="#0d47a1">IN2</text>
    <text x="110" y="167" fill="#0d47a1">IN3</text><text x="140" y="167" fill="#0d47a1">IN4</text>
    <text x="220" y="167" fill="#202124">−</text><text x="250" y="167" fill="#c62828">+</text>
  </g>
  <g font-size="9" fill="#5b6770" text-anchor="middle">
