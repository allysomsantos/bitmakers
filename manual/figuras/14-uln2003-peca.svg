<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- placa -->
  <rect x="20" y="22" width="260" height="114" rx="7" fill="#1565c0" stroke="#0a2f6b" stroke-width="2"/>
  <!-- plugue do motor -->
  <rect x="38" y="30" width="86" height="26" rx="3" fill="#f5f5f5" stroke="#9aa0a6" stroke-width="1.5"/>
  <g fill="#455a64">
    <rect x="46" y="38" width="8" height="12"/><rect x="58" y="38" width="8" height="12"/><rect x="70" y="38" width="8" height="12"/>
    <rect x="82" y="38" width="8" height="12"/><rect x="94" y="38" width="8" height="12"/>
  </g>
  <rect x="108" y="30" width="10" height="5" fill="#9aa0a6"/>
  <!-- LEDs -->
  <g stroke="#8e0000" stroke-width="1.5">
    <circle cx="170" cy="44" r="7" fill="#ff5252"/><circle cx="194" cy="44" r="7" fill="#ff5252"/>
    <circle cx="218" cy="44" r="7" fill="#ff5252"/><circle cx="242" cy="44" r="7" fill="#ff5252"/>
  </g>
  <!-- chip -->
  <g stroke="#cfd8dc" stroke-width="2">
