<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta-lcd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5b6770"/>
    </marker>
  </defs>

  <!-- Arduino -->
  <rect x="6" y="26" width="84" height="64" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="1.8"/>
  <text x="48" y="16" font-size="10.5" font-weight="700" fill="#00796b" text-anchor="middle">Arduino Uno</text>
  <text x="48" y="54" font-size="10.5" font-weight="600" fill="#004d40" text-anchor="middle">fio SDA</text>
  <text x="48" y="76" font-size="10.5" font-weight="600" fill="#004d40" text-anchor="middle">fio SCL</text>

  <!-- fios -->
  <line x1="90" y1="50" x2="170" y2="50" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="72" x2="170" y2="72" stroke="#e2a600" stroke-width="3" stroke-linecap="round"/>
  <text x="130" y="40" font-size="10" font-weight="700" fill="#0d47a1" text-anchor="middle">dados</text>
  <text x="130" y="87" font-size="10" font-weight="700" fill="#8a6500" text-anchor="middle">ritmo</text>
  <text x="130" y="104" font-size="10.5" font-weight="700" fill="#37474f" text-anchor="middle">1) só 4 fios</text>

  <!-- modulo I2C -->
  <rect x="170" y="26" width="106" height="64" rx="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/>
  <rect x="190" y="44" width="66" height="24" rx="2" fill="#263238"/>
  <text x="223" y="16" font-size="10.5" font-weight="700" fill="#0d47a1" text-anchor="middle">módulo I2C</text>
  <text x="223" y="80" font-size="9.5" fill="#e3f2fd" text-anchor="middle">2) recebe a mensagem</text>

  <!-- fios para a tela -->
  <g stroke="#78909c" stroke-width="1.6" stroke-linecap="round">
    <line x1="276" y1="38" x2="318" y2="38"/>
    <line x1="276" y1="46" x2="318" y2="46"/>
    <line x1="276" y1="54" x2="318" y2="54"/>
    <line x1="276" y1="62" x2="318" y2="62"/>
    <line x1="276" y1="70" x2="318" y2="70"/>
    <line x1="276" y1="78" x2="318" y2="78"/>
  </g>
  <text x="297" y="104" font-size="10.5" font-weight="700" fill="#37474f" text-anchor="middle">repassa à tela</text>

  <!-- tela -->
  <rect x="318" y="26" width="96" height="64" rx="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <rect x="326" y="36" width="80" height="34" rx="2" fill="#1565c0"/>
  <text x="366" y="16" font-size="10.5" font-weight="700" fill="#188038" text-anchor="middle">tela LCD</text>
  <text x="366" y="59" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e3f2fd" text-anchor="middle">Ola!</text>
  <text x="366" y="83" font-size="9.5" font-weight="700" fill="#e8f5e9" text-anchor="middle">3) escreve a letra</text>

  <!-- 16 x 2 -->
  <text x="6" y="123" font-size="10.5" font-weight="700" fill="#37474f">4) cada letra tem seu lugar:</text>
  <text x="6" y="146" font-size="10" fill="#37474f">16 colunas (0 a 15)</text>
  <text x="6" y="160" font-size="10" fill="#37474f">2 linhas (0 e 1)</text>
  <text x="6" y="182" font-size="10" font-weight="700" fill="#d9640a">setCursor(3, 1):</text>
  <text x="6" y="195" font-size="10" font-weight="700" fill="#d9640a">coluna 3, linha 1</text>
  <text x="213" y="148" font-size="9.5" fill="#37474f" text-anchor="end">linha 0</text>
  <text x="213" y="172" font-size="9.5" fill="#37474f" text-anchor="end">linha 1</text>
  <text x="219.5" y="130" font-size="9.5" fill="#37474f" text-anchor="middle">0</text>
  <text x="400.5" y="130" font-size="9.5" fill="#37474f" text-anchor="middle">15</text>
