<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Arduino -->
  <rect x="6" y="22" width="70" height="62" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="41" y="46" font-size="11" font-weight="700" fill="#004d40" text-anchor="middle">Arduino</text>
  <text x="41" y="62" font-size="9.5" fill="#004d40" text-anchor="middle">escreve a</text>
  <text x="41" y="74" font-size="9.5" fill="#004d40" text-anchor="middle">mensagem</text>

  <!-- fio e divisor -->
  <line x1="76" y1="46" x2="94" y2="46" stroke="#d9640a" stroke-width="2.4"/>
  <rect x="94" y="39" width="38" height="14" rx="2" fill="#fff3e0" stroke="#d9640a" stroke-width="1.6"/>
  <text x="113" y="49.5" font-size="9.5" font-weight="700" fill="#d9640a" text-anchor="middle">1 kΩ</text>
  <line x1="132" y1="46" x2="196" y2="46" stroke="#d9640a" stroke-width="2.4"/>
  <circle cx="156" cy="46" r="3.2" fill="#d9640a"/>
  <line x1="156" y1="46" x2="156" y2="58" stroke="#5b6770" stroke-width="2.4"/>
  <rect x="137" y="58" width="38" height="14" rx="2" fill="#fff3e0" stroke="#5b6770" stroke-width="1.6"/>
  <text x="156" y="68.5" font-size="9.5" font-weight="700" fill="#5b6770" text-anchor="middle">2 kΩ</text>
  <line x1="156" y1="72" x2="156" y2="84" stroke="#5b6770" stroke-width="2.4"/>
  <line x1="146" y1="84" x2="166" y2="84" stroke="#202124" stroke-width="2.4"/>
  <line x1="150" y1="89" x2="162" y2="89" stroke="#202124" stroke-width="2.4"/>
  <line x1="153" y1="94" x2="159" y2="94" stroke="#202124" stroke-width="2.4"/>
  <text x="82" y="36" font-size="10" font-weight="700" fill="#5b6770">5 V</text>
  <text x="192" y="36" font-size="10" font-weight="700" fill="#188038" text-anchor="end">cerca de 3,3 V</text>
  <text x="172" y="90" font-size="9.5" fill="#5b6770">GND</text>
  <text x="156" y="110" font-size="10" font-weight="700" fill="#d9640a" text-anchor="middle">divisor de tensão</text>

  <!-- HC-06 -->
  <rect x="196" y="22" width="74" height="62" rx="6" fill="#ede7f6" stroke="#8e44c8" stroke-width="2"/>
  <text x="202" y="42" font-size="9.5" font-weight="700" fill="#5b2c83">RXD</text>
  <text x="233" y="68" font-size="11" font-weight="700" fill="#5b2c83" text-anchor="middle">HC-06</text>
  <!-- ondas -->
  <g fill="none" stroke="#8e44c8" stroke-width="2.6" stroke-linecap="round">
    <path d="M280,42 q9,10 0,20"/><path d="M292,36 q13,16 0,32"/><path d="M305,30 q17,22 0,44"/>
  </g>
  <text x="300" y="96" font-size="10" font-weight="700" fill="#5b2c83" text-anchor="middle">rádio Bluetooth</text>
  <!-- tablet -->
  <rect x="342" y="14" width="70" height="86" rx="7" fill="#37474f"/>
  <rect x="347" y="20" width="60" height="74" rx="3" fill="#e8f0fe"/>
  <text x="377" y="42" font-size="10" font-weight="700" fill="#0d47a1" text-anchor="middle">app</text>
  <text x="377" y="58" font-size="9" fill="#37474f" text-anchor="middle">{"evento":</text>
  <text x="377" y="70" font-size="9" fill="#37474f" text-anchor="middle">"visita", ...}</text>
  <text x="377" y="113" font-size="10.5" font-weight="700" fill="#37474f" text-anchor="middle">Tablet</text>

  <!-- passos -->
  <g stroke-width="1.8">
    <rect x="6" y="128" width="126" height="56" rx="6" fill="#e0f2f1" stroke="#00796b"/>
    <rect x="147" y="128" width="126" height="56" rx="6" fill="#fff3e0" stroke="#d9640a"/>
    <rect x="288" y="128" width="126" height="56" rx="6" fill="#ede7f6" stroke="#8e44c8"/>
  </g>
  <g font-size="10" font-weight="700" text-anchor="middle" fill="#37474f">
    <text x="69" y="148">3) o Arduino manda</text>
    <text x="69" y="162">a mensagem (5 V)</text>
    <text x="210" y="148">O divisor baixa a</text>
    <text x="210" y="162">tensão para 3,3 V</text>
    <text x="351" y="148">4) o HC-06 manda no ar</text>
    <text x="351" y="162">5) o app do tablet lê</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#5b6770">
    <text x="69" y="176">(pelo pino TX)</text>
    <text x="210" y="176">(1 kΩ + 2 kΩ)</text>
    <text x="351" y="176">(só envia)</text>
  </g>
</svg>
