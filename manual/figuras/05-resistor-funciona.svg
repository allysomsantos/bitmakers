<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta-res" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d9640a"/>
    </marker>
  </defs>

  <!-- ===== painel 1: limitar corrente ===== -->
  <text x="6" y="11" font-size="9.5" font-weight="700" fill="#37474f">1) Segurar a corrente do LED</text>
  <text x="62" y="24" font-size="9.5" font-weight="700" fill="#d9640a" text-anchor="middle">corrente ≈ 14 mA</text>
  <line x1="24" y1="30" x2="112" y2="30" stroke="#d9640a" stroke-width="2" marker-end="url(#seta-res)"/>
  <text x="6" y="50" font-size="9.5" font-weight="700" fill="#c62828">5 V</text>
  <g fill="none" stroke="#37474f" stroke-width="2.2">
    <path d="M28,46 L56,46"/>
    <path d="M100,46 L128,46"/>
    <path d="M146,46 L176,46 L176,80"/>
  </g>
  <rect x="56" y="38" width="44" height="16" rx="2" fill="#e6c79c" stroke="#b08d57" stroke-width="1.6"/>
  <text x="78" y="49.5" font-size="9" font-weight="700" fill="#37474f" text-anchor="middle">220 Ω</text>
  <path d="M128,36 L128,56 L146,46 Z" fill="#ffcdd2" stroke="#c62828" stroke-width="1.8"/>
  <line x1="146" y1="36" x2="146" y2="56" stroke="#c62828" stroke-width="2"/>
  <g stroke="#f9a825" stroke-width="1.8" stroke-linecap="round">
    <line x1="136" y1="33" x2="142" y2="26"/><line x1="144" y1="35" x2="150" y2="28"/>
  </g>
  <g stroke="#202124" stroke-width="2">
    <line x1="166" y1="80" x2="186" y2="80"/><line x1="170" y1="85" x2="182" y2="85"/><line x1="173" y1="90" x2="179" y2="90"/>
  </g>
  <text x="176" y="102" font-size="9" font-weight="700" fill="#202124" text-anchor="middle">GND</text>
  <!-- quedas de tensao -->
  <g stroke="#5b6770" stroke-width="1.4" fill="none">
    <path d="M56,62 L56,66 L100,66 L100,62"/>
    <path d="M128,62 L128,66 L146,66 L146,62"/>
  </g>
  <text x="78" y="77" font-size="9" font-weight="700" fill="#37474f" text-anchor="middle">cai 3 V</text>
  <text x="145" y="77" font-size="9" font-weight="700" fill="#37474f" text-anchor="middle">cai 2 V</text>
  <text x="101" y="94" font-size="9" fill="#5b6770" text-anchor="middle">3 V + 2 V = 5 V da fonte</text>
  <!-- conta -->
  <rect x="6" y="108" width="198" height="46" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4"/>
  <text x="105" y="124" font-size="9.5" font-weight="700" fill="#37474f" text-anchor="middle">Lei de Ohm: V = R × I</text>
  <text x="105" y="142" font-size="9.5" font-weight="700" fill="#b4510a" text-anchor="middle">3 V ÷ 220 Ω ≈ 0,014 A = 14 mA</text>
  <text x="6" y="172" font-size="9" fill="#37474f">Sem o resistor, o LED ficaria com a tensão toda</text>
  <text x="6" y="184" font-size="9" fill="#37474f">e a corrente seria grande demais: ele queima.</text>

  <line x1="210" y1="6" x2="210" y2="194" stroke="#cfd8dc" stroke-dasharray="3 3"/>

  <!-- ===== painel 2: divisor de tensao ===== -->
  <text x="216" y="11" font-size="9.5" font-weight="700" fill="#37474f">2) Dividir a tensão (Bluetooth)</text>
  <text x="216" y="27" font-size="9" font-weight="700" fill="#c62828">sinal do Uno: 5 V</text>
  <g fill="none" stroke="#37474f" stroke-width="2.2">
    <path d="M250,32 L250,40"/>
    <path d="M250,76 L250,108"/>
    <path d="M250,144 L250,156"/>
    <path d="M250,100 L300,100"/>
  </g>
  <circle cx="250" cy="100" r="3.2" fill="#37474f"/>
  <rect x="242" y="40" width="16" height="36" rx="2" fill="#e6c79c" stroke="#b08d57" stroke-width="1.6"/>
  <rect x="242" y="108" width="16" height="36" rx="2" fill="#e6c79c" stroke="#b08d57" stroke-width="1.6"/>
  <text x="266" y="56" font-size="9" font-weight="700" fill="#37474f">1 kΩ</text>
  <text x="266" y="68" font-size="9" fill="#5b6770">cai 1,7 V</text>
  <text x="266" y="124" font-size="9" font-weight="700" fill="#37474f">2 kΩ</text>
  <text x="266" y="136" font-size="9" fill="#5b6770">cai 3,3 V</text>
  <text x="306" y="97" font-size="9" font-weight="700" fill="#37474f">entrada do HC-06</text>
  <text x="306" y="110" font-size="10.5" font-weight="700" fill="#188038">≈ 3,3 V</text>
  <g stroke="#202124" stroke-width="2">
    <line x1="240" y1="156" x2="260" y2="156"/><line x1="244" y1="161" x2="256" y2="161"/><line x1="247" y1="166" x2="253" y2="166"/>
  </g>
  <text x="266" y="164" font-size="9" font-weight="700" fill="#202124">GND</text>
  <text x="216" y="182" font-size="9" font-weight="700" fill="#b4510a">Dois resistores dividem a tensão:</text>
  <text x="216" y="194" font-size="9" font-weight="700" fill="#b4510a">5 V vira cerca de 3,3 V.</text>
</svg>
