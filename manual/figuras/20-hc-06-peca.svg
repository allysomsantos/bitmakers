<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- placa base azul -->
  <rect x="25" y="30" width="250" height="100" rx="7" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/>
  <!-- modulo verde com blindagem -->
  <rect x="38" y="40" width="176" height="80" rx="4" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <rect x="52" y="52" width="84" height="56" rx="3" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <text x="94" y="84" font-size="9" font-weight="700" fill="#455a64" text-anchor="middle">Bluetooth</text>
  <rect x="148" y="58" width="26" height="26" rx="2" fill="#263238"/>
  <!-- antena -->
  <path d="M180,108 l8,-14 l8,14 l8,-14 l8,14" fill="none" stroke="#ffd54f" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- LED -->
  <circle cx="246" cy="62" r="6" fill="#e53935" stroke="#8e0000" stroke-width="1.5"/>
  <line x1="246" y1="56" x2="246" y2="30" stroke="#5b6770" stroke-width="1.2"/>
  <!-- pinos -->
  <rect x="71" y="130" width="9" height="20" fill="#ffd54f" stroke="#b28704"/>
  <rect x="121" y="130" width="9" height="20" fill="#ffd54f" stroke="#b28704"/>
  <rect x="171" y="130" width="9" height="20" fill="#ffd54f" stroke="#b28704"/>
  <rect x="221" y="130" width="9" height="20" fill="#ffd54f" stroke="#b28704"/>
  <text x="75.5" y="165" font-size="11" font-weight="700" fill="#c62828" text-anchor="middle">VCC</text>
  <text x="125.5" y="165" font-size="11" font-weight="700" fill="#202124" text-anchor="middle">GND</text>
  <text x="175.5" y="165" font-size="11" font-weight="700" fill="#188038" text-anchor="middle">TXD</text>
  <text x="225.5" y="165" font-size="11" font-weight="700" fill="#d9640a" text-anchor="middle">RXD</text>
  <text x="75.5" y="177" font-size="9" fill="#5b6770" text-anchor="middle">5 V</text>
  <text x="125.5" y="177" font-size="9" fill="#5b6770" text-anchor="middle">terra</text>
  <text x="175.5" y="177" font-size="9" fill="#5b6770" text-anchor="middle">envia</text>
  <text x="225.5" y="177" font-size="9" fill="#5b6770" text-anchor="middle">recebe</text>
  <text x="225.5" y="187" font-size="9.5" font-weight="700" fill="#d9640a" text-anchor="middle">(só 3,3 V)</text>
  <!-- rotulos -->
  <text x="110" y="18" font-size="10.5" font-weight="700" fill="#0d47a1" text-anchor="middle">Módulo Bluetooth + antena</text>
  <text x="290" y="18" font-size="10.5" font-weight="700" fill="#c62828" text-anchor="end">LED de estado</text>
  <text x="290" y="30" font-size="9" fill="#5b6770" text-anchor="end">pisca = esperando · aceso = conectado</text>
</svg>
