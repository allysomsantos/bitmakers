<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- placa de trilhas -->
  <text x="62" y="14" font-size="11" font-weight="700" fill="#0d47a1" text-anchor="middle">placa de trilhas</text>
  <text x="62" y="25" font-size="9" fill="#5b6770" text-anchor="middle">(a parte que molha)</text>
  <rect x="10" y="32" width="104" height="118" rx="5" fill="#37474f" stroke="#1c262b" stroke-width="2"/>
  <!-- pente A -->
  <g stroke="#cfd8dc" stroke-width="5" stroke-linecap="round">
    <line x1="22" y1="44" x2="22" y2="116"/>
    <line x1="22" y1="44" x2="94" y2="44"/>
    <line x1="22" y1="80" x2="94" y2="80"/>
    <line x1="22" y1="116" x2="94" y2="116"/>
  </g>
  <!-- pente B -->
  <g stroke="#b0bec5" stroke-width="5" stroke-linecap="round">
    <line x1="102" y1="62" x2="102" y2="138"/>
    <line x1="34" y1="62" x2="102" y2="62"/>
    <line x1="34" y1="98" x2="102" y2="98"/>
    <line x1="34" y1="134" x2="102" y2="134"/>
  </g>
  <!-- gotas -->
  <path d="M60,48 C67,57 69,61 60,67 C51,61 53,57 60,48 Z" fill="#1e88e5" opacity=".9"/>
  <path d="M78,104 C84,111 86,115 78,120 C70,115 72,111 78,104 Z" fill="#1e88e5" opacity=".9"/>
  <path d="M44,84 C49,90 51,93 44,97 C37,93 39,90 44,84 Z" fill="#1e88e5" opacity=".9"/>
  <text x="62" y="165" font-size="9" fill="#5b6770" text-anchor="middle">as duas trilhas não se tocam</text>

  <!-- fios entre placa e modulo -->
  <line x1="114" y1="72" x2="170" y2="72" stroke="#f29900" stroke-width="3" stroke-linecap="round"/>
  <line x1="114" y1="100" x2="170" y2="100" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
  <text x="142" y="64" font-size="9" fill="#37474f" text-anchor="middle">2 fios</text>

  <!-- modulo -->
  <text x="228" y="14" font-size="11" font-weight="700" fill="#0d47a1" text-anchor="middle">módulo</text>
  <text x="228" y="25" font-size="9" fill="#5b6770" text-anchor="middle">(precisa ficar seco)</text>
  <rect x="170" y="32" width="116" height="84" rx="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/>
  <rect x="184" y="46" width="40" height="22" rx="2" fill="#263238"/>
  <rect x="238" y="44" width="32" height="32" rx="3" fill="#0d47a1" stroke="#082a63" stroke-width="1.5"/>
  <circle cx="254" cy="60" r="10" fill="#90caf9" stroke="#082a63"/>
  <line x1="247" y1="60" x2="261" y2="60" stroke="#082a63" stroke-width="2.2"/>
  <rect x="186" y="88" width="9" height="6" fill="#e53935"/>
  <rect x="204" y="88" width="9" height="6" fill="#43a047"/>
  <!-- pinos -->
  <rect x="182" y="116" width="9" height="16" fill="#ffd54f" stroke="#b28704"/>
  <rect x="208" y="116" width="9" height="16" fill="#ffd54f" stroke="#b28704"/>
  <rect x="234" y="116" width="9" height="16" fill="#ffd54f" stroke="#b28704"/>
  <rect x="260" y="116" width="9" height="16" fill="#ffd54f" stroke="#b28704"/>
  <text x="186.5" y="147" font-size="11" font-weight="700" fill="#c62828" text-anchor="middle">VCC</text>
  <text x="212.5" y="147" font-size="11" font-weight="700" fill="#202124" text-anchor="middle">GND</text>
  <text x="238.5" y="147" font-size="11" font-weight="700" fill="#5b6770" text-anchor="middle">DO</text>
  <text x="264.5" y="147" font-size="11" font-weight="700" fill="#188038" text-anchor="middle">AO</text>
  <text x="228" y="164" font-size="9" fill="#5b6770" text-anchor="middle">AO: número de 0 a 1023</text>
  <text x="228" y="176" font-size="9" fill="#5b6770" text-anchor="middle">DO: molhado ou seco (sim/não)</text>
</svg>
