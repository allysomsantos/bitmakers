<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- pinos da tomada -->
  <rect x="8" y="62" width="24" height="7" fill="#b0bec5" stroke="#78909c"/>
  <rect x="8" y="104" width="24" height="7" fill="#b0bec5" stroke="#78909c"/>
  <!-- corpo -->
  <rect x="32" y="40" width="118" height="94" rx="10" fill="#f5f5f5" stroke="#9aa0a6" stroke-width="2.5"/>
  <text x="91" y="76" font-size="11" font-weight="700" fill="#37474f" text-anchor="middle">SAÍDA</text>
  <text x="91" y="102" font-size="22" font-weight="700" fill="#c62828" text-anchor="middle">5 V</text>
  <text x="91" y="122" font-size="14" font-weight="700" fill="#37474f" text-anchor="middle">2 A</text>
  <!-- porta USB -->
  <rect x="150" y="78" width="22" height="26" rx="2" fill="#78909c" stroke="#455a64" stroke-width="1.5"/>
  <rect x="154" y="86" width="14" height="10" fill="#263238"/>
  <!-- cabo -->
  <path d="M172,91 H198" stroke="#455a64" stroke-width="6" stroke-linecap="round"/>
  <path d="M198,91 C225,91 235,70 266,70" fill="none" stroke="#d93025" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M198,91 C225,91 235,112 266,112" fill="none" stroke="#202124" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="266" cy="70" r="3.6" fill="#d93025"/><circle cx="266" cy="112" r="3.6" fill="#202124"/>
  <text x="274" y="74" font-size="11" font-weight="700" fill="#c62828">+5 V</text>
  <text x="274" y="116" font-size="11" font-weight="700" fill="#202124">GND</text>
  <!-- rotulos -->
  <text x="20" y="30" font-size="10.5" font-weight="700" fill="#0d47a1">Pinos para a tomada</text>
  <text x="20" y="150" font-size="9" fill="#5b6770">127 V ou 220 V</text>
  <text x="156" y="72" font-size="10.5" font-weight="700" fill="#0d47a1">Saída USB</text>
  <text x="150" y="172" font-size="10" font-weight="700" fill="#37474f" text-anchor="middle">Carregador USB de 5 V</text>
  <text x="150" y="185" font-size="9" fill="#5b6770" text-anchor="middle">ligamos nos fios + e − da ponta do cabo</text>
</svg>
