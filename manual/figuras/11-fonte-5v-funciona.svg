<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- 1 tomada -->
  <rect x="6" y="22" width="66" height="64" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <rect x="22" y="36" width="6" height="14" fill="#37474f"/><rect x="48" y="36" width="6" height="14" fill="#37474f"/>
  <text x="39" y="66" font-size="9.5" font-weight="700" fill="#37474f" text-anchor="middle">1 tomada</text>
  <text x="39" y="79" font-size="9" fill="#37474f" text-anchor="middle">127 / 220 V</text>
  <path d="M72,50 H80 V45 L92,54 L80,63 V58 H72 z" fill="#5b6770"/>
  <!-- 2 fonte -->
  <rect x="94" y="8" width="110" height="90" rx="8" fill="#fff8e1" stroke="#e2a600" stroke-width="2"/>
  <text x="149" y="30" font-size="10" font-weight="700" fill="#8d6e00" text-anchor="middle">2 Fonte de 5 V</text>
  <text x="149" y="50" font-size="9" fill="#37474f" text-anchor="middle">reduz a força</text>
  <text x="149" y="62" font-size="9" fill="#37474f" text-anchor="middle">da tomada</text>
  <text x="149" y="84" font-size="9.5" font-weight="700" fill="#c62828" text-anchor="middle">até 2 A de força</text>
  <!-- fios da fonte -->
  <line x1="204" y1="36" x2="262" y2="36" stroke="#d93025" stroke-width="3.6"/>
  <line x1="204" y1="70" x2="262" y2="70" stroke="#202124" stroke-width="3.6"/>
  <text x="233" y="28" font-size="9.5" font-weight="700" fill="#c62828" text-anchor="middle">4 a força</text>
  <text x="233" y="84" font-size="9" font-weight="700" fill="#202124" text-anchor="middle">GND</text>
  <!-- drivers -->
  <rect x="262" y="8" width="152" height="90" rx="8" fill="#fff3e0" stroke="#d9640a" stroke-width="2"/>
  <text x="338" y="28" font-size="10" font-weight="700" fill="#d9640a" text-anchor="middle">Drivers</text>
  <text x="338" y="44" font-size="9" fill="#37474f" text-anchor="middle">ULN2003 e L9110S</text>
  <text x="338" y="62" font-size="9" fill="#37474f" text-anchor="middle">ligam o motor</text>
  <text x="338" y="74" font-size="9" fill="#37474f" text-anchor="middle">de passo e a bomba</text>
  <!-- sinal do Arduino -->
  <rect x="262" y="140" width="152" height="52" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="338" y="162" font-size="10" font-weight="700" fill="#004d40" text-anchor="middle">Arduino Uno</text>
  <text x="338" y="178" font-size="9" fill="#004d40" text-anchor="middle">só manda o sinal</text>
  <path d="M392,140 V114 H387 L396,100 L405,114 H400 V140 z" fill="#188038"/>
  <text x="386" y="128" font-size="9.5" font-weight="700" fill="#188038" text-anchor="end">3 sinalzinho</text>
  <!-- GND comum -->
  <line x1="284" y1="98" x2="284" y2="140" stroke="#202124" stroke-width="3.6"/>
  <rect x="190" y="106" width="88" height="20" rx="10" fill="#ffd54f" stroke="#b28704" stroke-width="1.5"/>
  <text x="234" y="120" font-size="9.5" font-weight="700" fill="#202124" text-anchor="middle">5 GND comum!</text>
  <!-- sede de corrente -->
  <text x="6" y="126" font-size="9.5" font-weight="700" fill="#37474f">Sede de corrente:</text>
  <text x="6" y="146" font-size="9" fill="#37474f">Pino do Arduino</text>
  <rect x="94" y="138" width="4" height="10" fill="#188038"/>
  <text x="102" y="146" font-size="9" font-weight="700" fill="#188038">até 20 mA</text>
  <text x="6" y="163" font-size="9" fill="#37474f">Motor</text>
  <rect x="94" y="155" width="48" height="10" fill="#d9640a"/>
  <text x="148" y="163" font-size="9" font-weight="700" fill="#d9640a">240 mA</text>
  <text x="6" y="180" font-size="9" fill="#37474f">Bomba</text>
  <rect x="94" y="172" width="100" height="10" fill="#d9640a"/>
  <text x="200" y="180" font-size="9" font-weight="700" fill="#d9640a">até 500 mA</text>
  <text x="6" y="196" font-size="9" fill="#5b6770">A força vem da fonte, não do Arduino.</text>
</svg>
