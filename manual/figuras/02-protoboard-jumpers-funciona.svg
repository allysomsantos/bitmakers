<text x="8" y="98" font-size="9" fill="#37474f">1) A perna entra no furo e uma mola</text>
<text x="8" y="109" font-size="9" fill="#37474f">de metal a segura.</text>
<text x="8" y="125" font-size="9" fill="#37474f">2) A tira de metal liga os 5 furos</text>
<text x="8" y="136" font-size="9" fill="#37474f">da coluna: a corrente vai de um a outro.</text>
<text x="8" y="152" font-size="9" fill="#37474f">3) Um fio em outro furo da mesma coluna</text>
<text x="8" y="163" font-size="9" fill="#37474f">recebe o sinal.</text>
<text x="8" y="188" font-size="9" font-weight="700" fill="#b4510a">Colunas diferentes nunca se tocam.</text>
