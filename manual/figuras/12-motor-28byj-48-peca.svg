  <text x="176" y="30" font-size="10.5" font-weight="700" fill="#0d47a1">Eixo de saída</text>
  <text x="176" y="42" font-size="9" fill="#5b6770">(é ele que gira)</text>
  <text x="176" y="67" font-size="10.5" font-weight="700" fill="#0d47a1">Orelha de fixação</text>
  <text x="176" y="101" font-size="10.5" font-weight="700" fill="#0d47a1">Carcaça metálica</text>
  <text x="176" y="113" font-size="9" fill="#5b6770">(bobinas e engrenagens</text>
  <text x="176" y="124" font-size="9" fill="#5b6770">ficam por dentro)</text>
  <text x="128" y="148" font-size="10.5" font-weight="700" fill="#0d47a1">Plugue de 5 pinos</text>
  <text x="128" y="160" font-size="9" fill="#c62828" font-weight="700">vermelho = comum (+5 V)</text>
  <text x="128" y="171" font-size="9" fill="#5b6770">azul, rosa, amarelo, laranja</text>
  <text x="128" y="182" font-size="9" fill="#5b6770">= as 4 bobinas</text>
</svg>
