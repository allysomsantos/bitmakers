  <rect x="66" y="140" width="44" height="22" rx="3" fill="#f5f5f5" stroke="#9aa0a6" stroke-width="1.5"/>
  <g fill="#455a64">
    <rect x="70" y="146" width="5" height="10"/><rect x="77" y="146" width="5" height="10"/><rect x="84.5" y="146" width="5" height="10"/>
    <rect x="92" y="146" width="5" height="10"/><rect x="99" y="146" width="5" height="10"/>
  </g>
  <!-- rotulos -->
  <g stroke="#5b6770" stroke-width="1.1">
    <line x1="97" y1="42" x2="172" y2="30"/>
    <line x1="154" y1="62" x2="172" y2="64"/>
    <line x1="126" y1="86" x2="172" y2="98"/>
    <line x1="110" y1="152" x2="124" y2="152"/>
