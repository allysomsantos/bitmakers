<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- orelhas de fixacao -->
  <rect x="18" y="52" width="140" height="18" rx="9" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
  <circle cx="30" cy="61" r="4.5" fill="#fff" stroke="#546e7a"/>
  <circle cx="146" cy="61" r="4.5" fill="#fff" stroke="#546e7a"/>
  <!-- carcaca -->
  <circle cx="88" cy="62" r="48" fill="#cfd8dc" stroke="#607d8b" stroke-width="2.5"/>
  <circle cx="88" cy="62" r="38" fill="none" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- eixo -->
  <circle cx="88" cy="46" r="15" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
  <circle cx="88" cy="46" r="8" fill="#fff8e1" stroke="#8d6e00" stroke-width="2"/>
  <line x1="84.5" y1="40" x2="84.5" y2="52" stroke="#8d6e00" stroke-width="1.2"/>
  <line x1="91.5" y1="40" x2="91.5" y2="52" stroke="#8d6e00" stroke-width="1.2"/>
  <!-- fios -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M76,108 C76,125 74,130 74,140" stroke="#1a73e8"/>
    <path d="M82,109 C82,125 80,130 80,140" stroke="#e91e8c"/>
    <path d="M88,110 C88,125 87,130 87,140" stroke="#f2c200"/>
