name: 'B2 - Anjos da Estrada: chuva, farol queimado e prioridade da tela'
version: 1
author: 'BITMAKERS'
# ATENCAO: este cenario foi escrito sem poder ser executado (token do Wokwi invalido).
# Convencao das chaves deslizantes: value 0 = esquerda, value 1 = direita. Os farois ficam sempre ligados;
# a chave "LED removido" para a direita simula tirar o LED da protoboard.
steps:
  # 1. Tudo parado: HC-SR04 em 200 cm (nada perto), pista seca, farois com LED -> "Tudo OK"
  - wait-serial: '"chuva":false,"farol_e":"ok","farol_d":"ok"}'
  - delay: 300ms
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b2-1-tudo-ok.png

  # 2. Pista molhada: potenciometro no minimo (FC-37 molhado = valor baixo)
  - set-control:
      part-id: chuva
      control: position
      value: 0
  - wait-serial: '"chuva":true'
  - delay: 300ms
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b2-2-pista-molhada.png

  # 3. Pista seca de novo: farol esquerdo com corrente normal -> "ok"
  - set-control:
      part-id: chuva
      control: position
      value: 1
  - wait-serial: '"chuva":false,"farol_e":"ok"'
  - delay: 300ms
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b2-7-farol-ok.png

  # 4. Tira o LED esquerdo (chave "LED esq removido" para a direita): depois de 3 leituras vira "queimado"
  - set-control:
      part-id: sw_sem_e
      control: value
      value: 1
  - wait-serial: '"farol_e":"queimado"'
  - delay: 300ms
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b2-7-farol-queimado.png

  # 5. Poe o LED de volta (chave "LED esq removido" para a esquerda): volta a "ok" e o alerta some
  - set-control:
      part-id: sw_sem_e
      control: value
      value: 0
  - wait-serial: '"farol_e":"ok"'
  - delay: 300ms
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b2-7-farol-recolocado.png
