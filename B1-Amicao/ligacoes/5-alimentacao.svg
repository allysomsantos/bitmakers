<rect x="960" y="40" width="500" height="400" rx="14" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="1.5" />
<text x="985" y="82" font-size="20" fill="#e8e6dc" text-anchor="start" font-weight="600" >Tudo que é 5V fica na fonte separada:</text>
<text x="985" y="114" font-size="20" fill="#cfcdc2" text-anchor="start" font-weight="400" >• motor de passo (ULN2003)</text>
<text x="985" y="146" font-size="20" fill="#cfcdc2" text-anchor="start" font-weight="400" >• relé e bomba</text>
<text x="985" y="178" font-size="20" fill="#cfcdc2" text-anchor="start" font-weight="400" >• HX711 (balança)</text>
<text x="985" y="210" font-size="20" fill="#cfcdc2" text-anchor="start" font-weight="400" >• HM-10 (Bluetooth)</text>
<text x="985" y="274" font-size="20" fill="#e8e6dc" text-anchor="start" font-weight="600" >No 3,3V do Arduino fica só:</text>
<text x="985" y="306" font-size="20" fill="#cfcdc2" text-anchor="start" font-weight="400" >• RC522</text>
<text x="985" y="370" font-size="20" fill="#e8e6dc" text-anchor="start" font-weight="600" >O GND é um só: liga o GND da fonte</text>
<text x="985" y="402" font-size="20" fill="#e8e6dc" text-anchor="start" font-weight="600" >no GND do Arduino.</text>
<text x="985" y="430" font-size="19" fill="#ff9a9a" text-anchor="start" font-weight="400" >Nunca ligue o +5V da fonte no pino 5V do Arduino.</text>
</svg>
