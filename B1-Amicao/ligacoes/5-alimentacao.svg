<text x="622" y="897" font-size="22" fill="#7fb2ee" text-anchor="start" font-weight="400" >−</text>
<rect x="600" y="1010" width="280" height="190" rx="14" fill="#0a5240" stroke="#2a9d78" stroke-width="1.5" />
