<text x="258" y="217" font-size="22" fill="#a5a398" text-anchor="end" font-weight="400" >+5V</text>
<text x="155.0" y="248" font-size="18" fill="#a5a398" text-anchor="middle" font-weight="400" >2A ou mais</text>
<rect x="600" y="40" width="280" height="150" rx="14" fill="#47453f" stroke="#6e6c63" stroke-width="1.5" />
