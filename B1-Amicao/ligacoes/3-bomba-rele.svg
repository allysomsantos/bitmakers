<text x="30" y="470" font-size="20" fill="#f5b25c" text-anchor="start" font-weight="400" >Este módulo relé (3 pinos: IN, GND, VCC, com transistor) liga com sinal HIGH, como o código já faz.</text>
<text x="30" y="500" font-size="20" fill="#f5b25c" text-anchor="start" font-weight="400" >Se o relé ligar sozinho ao ligar o Arduino, o seu liga com LOW: troque NIVEL_BOMBA_LIGADA no sketch.</text>
<text x="30" y="530" font-size="20" fill="#a5a398" text-anchor="start" font-weight="400" >O D8 não é mais usado.</text>
