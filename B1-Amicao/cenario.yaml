name: 'B1 - Amicao: cadastro de tags, visita, intervalo, remocao e agua por visita'
version: 1
author: 'BITMAKERS'
steps:
  # 1. Liga com a balanca vazia (ela zera no boot). A EEPROM do Wokwi comeca vazia: ninguem cadastrado.
  - wait-serial: 'ligado'

  # 2. Rex (Blue Card, uid 0A:0B:0C:0D) sobe na balanca com 7 kg e passa a tag SEM cadastro.
  #    Esperado: NADA acontece (nenhuma linha APP> nova; so aparece "MSG> Tag nao cadastrada" no Serial).
  #    O Wokwi nao tem "esperar que NAO apareca nada": confira o Serial depois de 2 s
  #    e o log do Serial (--serial-log-file) mostra que nao saiu nenhuma linha.
  - set-control:
      part-id: balanca
      control: load
      value: 7
  - set-control:
      part-id: rfid
      control: card
      value: 0
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - delay: 2s
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0
  - delay: 500ms

  # 3. O app manda "cadastrar": o Arduino entra no modo cadastro
  - write-serial: "{\"cmd\":\"cadastrar\"}\n"
  - wait-serial: '"evento":"modo_cadastro","ativo":true'
  - delay: 300ms

  # 4. Passa a tag: sai tag_lida com o UID e o modo cadastro termina
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - wait-serial: '"evento":"tag_lida","uid":"0A:0B:0C:0D"'
  - wait-serial: '"evento":"modo_cadastro","ativo":false'
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0
  - delay: 500ms

  # 5. O app escolhe o nome e manda "permitir": o Arduino grava na EEPROM e devolve a lista
  - write-serial: "{\"cmd\":\"permitir\",\"uid\":\"0A:0B:0C:0D\",\"nome\":\"Rex\"}\n"
  - wait-serial: '"evento":"cadastros","uids":["0A:0B:0C:0D"]'

  # 6. Agora o Rex e reconhecido: o Serial mostra "MSG> Ola, Rex!", solta racao e manda a visita
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - delay: 250ms
  # A agua vem junto com a visita: bomba liga e desliga antes do evento "visita"
  - wait-serial: '"bomba":"ligada"'
  - wait-serial: '"bomba":"desligada"'
  - wait-serial: '"evento":"visita","uid":"0A:0B:0C:0D"'

  # 7. Tira a tag, espera passar os 3 s de "mesma tag repetida" e passa o Rex de novo.
  #    Intervalo da simulacao e 15 s, entao ele deve receber "racao":false
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0
  - delay: 4s
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - wait-serial: '"racao":false'
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0

  # 8. Cadastra a Pipoca (Green Card, uid 11:22:33:44) direto com "permitir" (sem modo cadastro)
  #    e confere que ela come normalmente
  - delay: 500ms
  - write-serial: "{\"cmd\":\"permitir\",\"uid\":\"11:22:33:44\",\"nome\":\"Pipoca\"}\n"
  - wait-serial: '"uids":["0A:0B:0C:0D","11:22:33:44"]'
  - set-control:
      part-id: rfid
      control: card
      value: 1
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - wait-serial: '"evento":"visita","uid":"11:22:33:44"'
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0
  - delay: 500ms

  # 9. O app manda "remover" o Rex: a lista fica so com a Pipoca
  - write-serial: "{\"cmd\":\"remover\",\"uid\":\"0A:0B:0C:0D\"}\n"
  - wait-serial: '"evento":"cadastros","uids":["11:22:33:44"]'
  # remove tambem a Pipoca: a lista fica vazia
  - write-serial: "{\"cmd\":\"remover\",\"uid\":\"11:22:33:44\"}\n"
  - wait-serial: '"evento":"cadastros","uids":[]'

  # 10. Rex passa a tag de novo (depois de removido): nada acontece de novo (confira no log do Serial)
  - set-control:
      part-id: rfid
      control: card
      value: 0
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - delay: 2s
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0
