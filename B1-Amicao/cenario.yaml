name: 'B1 - Amicao: visita, intervalo, tag desconhecida e agua'
version: 1
author: 'BITMAKERS'
steps:
  # 1. Liga com a balanca vazia (ela zera no boot)
  - wait-serial: 'ligado'
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b1-1-tela-inicial.png

  # 2. Rex (Blue Card, uid 0A:0B:0C:0D) sobe na balanca com 7 kg e apresenta a tag
  - set-control:
      part-id: balanca
      control: load
      value: 7
  - set-control:
      part-id: rfid
      control: card
      value: 0
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  # na simulacao a pesagem dura 0,5 s; o LCD mostra "Pesando..." e depois "Soltando racao"
  - delay: 450ms
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b1-2-pesando.png
  - wait-serial: '"evento":"visita"'
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b1-3-visita-rex.png

  # 3. Tira a tag, espera passar os 3 s de "mesma tag repetida" e passa o Rex de novo.
  #    Intervalo da simulacao e 15 s, entao ele deve receber "racao":false
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0
  - delay: 4s
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - wait-serial: '"racao":false'
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b1-4-rex-ja-comeu.png
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0

  # 4. Pipoca (Green Card, uid 11:22:33:44, ja esta na lista cachorros[]): come normalmente
  - delay: 500ms
  - set-control:
      part-id: rfid
      control: card
      value: 1
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - delay: 450ms
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b1-5-pipoca.png
  - wait-serial: '11:22:33:44'
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0

  # 5. Tag desconhecida (Yellow Card): aparece "Novo amigo", ganha racao e o UID sai no Serial
  - delay: 500ms
  - set-control:
      part-id: rfid
      control: card
      value: 2
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - wait-serial: 'Tag nao cadastrada'
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b1-6-novo-amigo.png
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0

  # 6. Outra tag desconhecida (Red Card). Esperado: outro cachorro novo come tambem.
  #    Se vier "racao":false, e o defeito do registro compartilhado "desconhecido".
  - delay: 500ms
  - set-control:
      part-id: rfid
      control: card
      value: 3
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 1
  - wait-serial: '"evento":"visita"'
  - delay: 500ms
  - set-control:
      part-id: rfid
      control: tagPresent
      value: 0

  # 7. Agua: potenciometro ao maximo = pote seco, bomba liga; volta ao zero, desliga
  - set-control:
      part-id: agua
      control: position
      value: 1
  - wait-serial: '"bomba":"ligada"'
  - set-control:
      part-id: agua
      control: position
      value: 0
  - wait-serial: '"bomba":"desligada"'

  # 8. Reservatorio vazio: seco por mais de 5 s, a bomba desliga e manda alerta
  - set-control:
      part-id: agua
      control: position
      value: 1
  - wait-serial: 'reservatorio_vazio'
  - take-screenshot:
      part-id: lcd1
      save-to: prints/b1-7-sem-agua.png
